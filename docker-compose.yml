services:
  database:
    container_name: database
    image: postgres:latest
    restart: always
    env_file:
      - configs/config.env
    ports:
      - "5000:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/
  app:
    container_name: app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - database
    ports:
      - "8080:8080"
    env_file:
      - configs/config.env